<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f6f9fc;
    padding: 20px;
  }
  .container {
    max-width: 400px;
    margin: 0 auto;
  }
  h2 {
    font-size: 18px;
    color: #32325d;
    margin-bottom: 16px;
  }
  #card-element {
    background: white;
    padding: 12px;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  #card-errors {
    color: #e25950;
    font-size: 13px;
    margin-bottom: 12px;
    min-height: 20px;
  }
  button {
    background: #635bff;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
    font-weight: 600;
  }
  button:hover { background: #524ddb; }
  button:disabled {
    background: #aab7c4;
    cursor: not-allowed;
  }
  #success-message {
    display: none;
    background: #d4edda;
    color: #155724;
    padding: 12px;
    border-radius: 6px;
    font-size: 14px;
    margin-top: 12px;
  }
</style>
</head>
<body>
<div class="container">
  <h2>Enter Card Details</h2>
  <div id="card-element"></div>
  <div id="card-errors"></div>
  <button id="submit-btn" onclick="handleSubmit()">Save Card</button>
  <div id="success-message"></div>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script>
  // PUBLISHABLE_KEY will be replaced by FileMaker before loading
  var stripe = Stripe('PUBLISHABLE_KEY');
  var elements = stripe.elements();
  var cardElement = elements.create('card', {
    style: {
      base: {
        fontSize: '16px',
        color: '#32325d',
        '::placeholder': { color: '#aab7c4' }
      },
      invalid: { color: '#e25950' }
    }
  });
  cardElement.mount('#card-element');

  cardElement.on('change', function(event) {
    var errorEl = document.getElementById('card-errors');
    errorEl.textContent = event.error ? event.error.message : '';
  });

  function handleSubmit() {
    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Processing...';

    stripe.createPaymentMethod({
      type: 'card',
      card: cardElement
    }).then(function(result) {
      if (result.error) {
        document.getElementById('card-errors').textContent = result.error.message;
        btn.disabled = false;
        btn.textContent = 'Save Card';
      } else {
        var pm = result.paymentMethod;
        var successEl = document.getElementById('success-message');
        successEl.textContent = 'Card saved: ' + pm.card.brand + ' ending in ' + pm.card.last4;
        successEl.style.display = 'block';
        btn.style.display = 'none';

        // Send the PaymentMethod ID back to FileMaker
        // FileMaker.PerformScript calls the specified script with the pm_xxx as parameter
        try {
          FileMaker.PerformScript('Stripe Attach Card', JSON.stringify({
            paymentMethodID: pm.id,
            last4: pm.card.last4,
            brand: pm.card.brand,
            expMonth: pm.card.exp_month,
            expYear: pm.card.exp_year
          }));
        } catch(e) {
          // Not running in FileMaker Web Viewer — log for testing
          console.log('PaymentMethod created:', pm.id);
          console.log('Would call FileMaker.PerformScript with:', pm.id);
        }
      }
    });
  }
</script>
</body>
</html>
